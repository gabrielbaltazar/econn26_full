name: Entrega continua - CD

on:
    pull_request:
        types:
            - closed
        branches:
            - master

jobs:
    econn2026-cd:
        if: github.event.pull_request.merged == true
        runs-on: self-hosted
        permissions:
            contents: write
            pull-requests: read
        
        steps:
            - name: BaixarCodigo
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
        
            - name: Calcular versão
              id: version
              shell: powershell
              run: |
                git fetch --tags

                $prefix = Get-Date -Format "yy.MM"

                $last = git tag --list "$prefix.*" |
                        Sort-Object |
                        Select-Object -Last 1

                if ($last)
                {
                    $build = [int]($last.Split('.')[-1]) + 1
                }
                else
                {
                    $build = 1
                }

                $version = "{0}.{1:D2}" -f $prefix,$build

                echo "VERSION=$version" >> $env:GITHUB_ENV
                echo "version=$version" >> $env:GITHUB_OUTPUT

            - name: Buscar Pull Requests mescladas
              id: prs
              shell: powershell
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                CURRENT_PR_NUMBER: ${{ github.event.pull_request.number }}
                CURRENT_PR_TITLE: ${{ github.event.pull_request.title }}
                CURRENT_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                CURRENT_PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
              run: |
                [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

                $headers = @{
                    Authorization = "Bearer $env:GH_TOKEN"
                    Accept        = "application/vnd.github+json"
                    "User-Agent"  = "econn2026-release-workflow"
                }

                #
                # Ponto de corte: data da última tag de release (formato yy.MM.NN, ordenável como texto)
                #
                $lastTag = git tag --list "*.*.*" | Sort-Object | Select-Object -Last 1
                $cutoff = $null
                if ($lastTag)
                {
                    $cutoff = Get-Date (git log -1 --format=%cI $lastTag)
                }

                #
                # Busca as PRs fechadas mais recentes na master (assume menos de 100 fechadas entre releases)
                #
                $uri = "https://api.github.com/repos/${{ github.repository }}/pulls?state=closed&base=master&sort=updated&direction=desc&per_page=100"
                $closedPRs = Invoke-RestMethod -Uri $uri -Headers $headers

                $mergedPRs = @($closedPRs | Where-Object {
                    $_.merged_at -and (-not $cutoff -or (Get-Date $_.merged_at) -gt $cutoff)
                })

                #
                # Garante que a PR que disparou este merge sempre apareça, mesmo se a API ainda não a listar
                #
                $currentNumber = [int]$env:CURRENT_PR_NUMBER
                if (-not ($mergedPRs | Where-Object { $_.number -eq $currentNumber }))
                {
                    $mergedPRs = @([PSCustomObject]@{
                        number    = $currentNumber
                        title     = $env:CURRENT_PR_TITLE
                        merged_at = $env:CURRENT_PR_MERGED_AT
                        user      = [PSCustomObject]@{ login = $env:CURRENT_PR_AUTHOR }
                    }) + $mergedPRs
                }

                $mergedPRs = @($mergedPRs | Sort-Object merged_at)

                $prsPath = Join-Path $env:RUNNER_TEMP "merged_prs.json"
                ConvertTo-Json -InputObject $mergedPRs -Depth 5 | Out-File $prsPath -Encoding utf8

                echo "PRS_PATH=$prsPath" >> $env:GITHUB_ENV

            - name: Criar/Atualizar CHANGELOG
              shell: powershell
              run: |
                $version = "${{ env.VERSION }}"
                $date = Get-Date -Format "yyyy-MM-dd"

                #
                # Cria o arquivo caso não exista
                #
                if (!(Test-Path CHANGELOG.md))
                {
                  @'
# Changelog

Todas as alterações relevantes deste projeto serão documentadas neste arquivo.

---

'@ | Out-File CHANGELOG.md -Encoding UTF8
                }

                #
                # Monta a lista de Pull Requests mescladas encontradas pelo step anterior
                #
                $mergedPRs = @(Get-Content $env:PRS_PATH -Raw | ConvertFrom-Json)
                $prLines = foreach ($pr in $mergedPRs) { "- #$($pr.number) - $($pr.title) (@$($pr.user.login))" }
                $prBlock = $prLines -join "`n"

                #
                # Monta nova versão
                #
                $newEntry = @"

## [$version] - $date

### Pull Requests

$prBlock

---

"@

                #
                # Insere a versão depois do cabeçalho
                #
                $content = Get-Content CHANGELOG.md -Raw

                $content = $content -replace "(# Changelog.*?\r?\n\r?\n)", "`$1$newEntry"

                Set-Content CHANGELOG.md $content -Encoding UTF8

            - name: Commit CHANGELOG
              shell: powershell
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                git add CHANGELOG.md

                git commit -m "docs: atualiza changelog ${{ env.VERSION }}"

                git push origin master

            - name: Criar Tag
              run: |
                git tag ${{ env.VERSION }}
                git push origin ${{ env.VERSION }}