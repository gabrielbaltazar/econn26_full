name: Entrega continua - CD

on:
    pull_request:
        types:
            - closed
        branches:
            - master

jobs:
    econn2026-cd:
        if: github.event.pull_request.merged == true
        runs-on: self-hosted
        permissions:
            contents: write
        
        steps:
            - name: BaixarCodigo
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
        
            - name: Calcular versão
              id: version
              shell: powershell
              run: |
                git fetch --tags

                $prefix = Get-Date -Format "yy.MM"

                $last = git tag --list "$prefix.*" |
                        Sort-Object |
                        Select-Object -Last 1

                if ($last)
                {
                    $build = [int]($last.Split('.')[-1]) + 1
                }
                else
                {
                    $build = 1
                }

                $version = "{0}.{1:D2}" -f $prefix,$build

                echo "VERSION=$version" >> $env:GITHUB_ENV
                echo "version=$version" >> $env:GITHUB_OUTPUT

            - name: Criar/Atualizar CHANGELOG
              shell: powershell
              run: |
                $version = "${{ env.VERSION }}"
                $date = Get-Date -Format "yyyy-MM-dd"

                #
                # Cria o arquivo caso não exista
                #
                if (!(Test-Path CHANGELOG.md))
                {
                  @'
# Changelog

Todas as alterações relevantes deste projeto serão documentadas neste arquivo.

---

'@ | Out-File CHANGELOG.md -Encoding UTF8
                }


                #
                # Busca informações do Pull Request
                #
                $prNumber = "${{ github.event.pull_request.number }}"
                $prTitle = "${{ github.event.pull_request.title }}"
                $prAuthor = "${{ github.event.pull_request.user.login }}"


                #
                # Monta nova versão
                #
                $newEntry = @"

## [$version] - $date

### Pull Requests

- #$prNumber - $prTitle (@$prAuthor)

---

"@


                #
                # Insere a versão depois do cabeçalho
                #
                $content = Get-Content CHANGELOG.md -Raw

                $content = $content -replace "(# Changelog.*?\r?\n\r?\n)", "`$1$newEntry"

                Set-Content CHANGELOG.md $content -Encoding UTF8

            - name: Commit CHANGELOG
              shell: powershell
              run: |

                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                git add CHANGELOG.md

                git commit -m "docs: atualiza changelog ${{ env.VERSION }}"

                git push origin master

            - name: Criar Tag
              run: |
                git tag ${{ env.VERSION }}
                git push origin ${{ env.VERSION }}